# Caddy supplies HTTPS when the optional production overlay is enabled.
map $http_x_forwarded_proto $upstream_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    server_tokens off;

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The backend sends its own security headers and Cache-Control: no-store.
    location /api/ {
        # JSON only; the largest legitimate body is a checkout with 100 lines.
        client_max_body_size 64k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # /admin is the React role portal; the backend has no Django admin site.
    location /media/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires 1h;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires 7d;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
