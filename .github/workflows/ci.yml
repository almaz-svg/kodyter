name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every value below is a throwaway CI value. No repository secret is used.
# Passwords and keys here protect nothing outside this workflow run.
jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine   # same major version as docker-compose.yml
        env:
          POSTGRES_DB: anasym_test
          POSTGRES_USER: anasym_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anasym_test -d anasym_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL_TEST: postgresql://anasym_test:ci-test-only-password@localhost:5432/anasym_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django tests on PostgreSQL (concurrency included, zero skipped)
        run: |
          set -o pipefail
          python manage.py test --noinput 2>&1 | tee test-output.txt
          # Django prints a bare "OK" only when nothing was skipped; "OK (skipped=N)" fails here.
          if ! grep -qx 'OK' test-output.txt; then
            echo "::error::Django tests failed or some were skipped. Expected a bare 'OK'."
            exit 1
          fi

      - name: Deployment checks with production-like settings
        env:
          DEBUG: 'false'
          DJANGO_SECRET_KEY: ci-production-check-value-that-is-not-a-secret-0123456789abcdef
          ALLOWED_HOSTS: example.test
          CSRF_TRUSTED_ORIGINS: https://example.test
          FRONTEND_URL: https://example.test
          COOKIE_SECURE: 'true'
          SECURE_SSL_REDIRECT: 'true'
          SECURE_HSTS_SECONDS: '31536000'
          TRUST_PROXY: 'true'
          TRUSTED_PROXY_COUNT: '1'
          DATABASE_URL: postgresql://anasym_test:ci-test-only-password@localhost:5432/anasym_test
        run: python manage.py check --deploy --fail-level WARNING

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # same major version as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  infrastructure:
    name: infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The nginx upstreams are compose service names; map them to loopback so `nginx -t` can resolve them.
      - name: nginx configuration test
        run: |
          docker run --rm \
            --add-host=backend:127.0.0.1 \
            --add-host=frontend:127.0.0.1 \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            nginx:1.28-alpine nginx -t

      # Caddy is used by deploy/compose.https.yml, so its configuration is validated too.
      - name: Caddy configuration validation
        run: |
          docker run --rm \
            -e DOMAIN=example.test \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks must see the full history, not only the last commit

      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
